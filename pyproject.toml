[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honey-prompt-detector"
version = "0.1.0"
description = "A specialized prompt-injection detection framework leveraging honey-prompt tokens, LLM-based classification, and monitoring tools to protect Large Language Models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yaima Valdivia", email = "yaimamvaldivia@gmail.com"},
]
keywords = [
    "security",
    "llm",
    "prompt-injection",
    "machine-learning",
    "cybersecurity",
    "ai-safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohappyeyeballs>=2.4.4",
    "aiohttp>=3.11.11",
    "aiosignal>=1.3.2",
    "annotated-types>=0.7.0",
    "anyio>=4.8.0",
    "attrs>=25.1.0",
    "certifi>=2025.1.31",
    "charset-normalizer>=3.4.1",
    "cramjam>=2.9.1",
    "datasets>=3.3.2",
    "dill>=0.3.8",
    "distro>=1.9.0",
    "fastparquet>=2024.11.0",
    "filelock>=3.17.0",
    "frozenlist>=1.5.0",
    "fsspec>=2024.12.0",
    "h11>=0.14.0",
    "httpcore>=1.0.7",
    "httpx>=0.28.1",
    "huggingface-hub>=0.28.1",
    "idna>=3.10",
    "Jinja2>=3.1.5",
    "jiter>=0.8.2",
    "joblib>=1.4.2",
    "kagglehub>=0.3.10",
    "MarkupSafe>=3.0.2",
    "mpmath>=1.3.0",
    "multidict>=6.1.0",
    "multiprocess>=0.70.16",
    "networkx>=3.4.2",
    "numpy>=2.2.2",
    "openai>=1.60.2",
    "packaging>=24.2",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "propcache>=0.2.1",
    "protobuf>=5.29.3",
    "pyarrow>=19.0.1",
    "pydantic>=2.10.6",
    "pydantic_core>=2.27.2",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
    "pytz>=2025.1",
    "PyYAML>=6.0.2",
    "RapidFuzz>=3.12.1",
    "regex>=2024.11.6",
    "requests>=2.32.3",
    "safetensors>=0.5.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "sentence-transformers>=3.4.1",
    "sentencepiece>=0.2.0",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "sympy>=1.13.1",
    "threadpoolctl>=3.5.0",
    "tiktoken>=0.8.0",
    "tokenizers>=0.21.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.2",
    "typing_extensions>=4.12.2",
    "tzdata>=2025.1",
    "urllib3>=2.3.0",
    "xxhash>=3.5.0",
    "yarl>=1.18.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]
production = [
    "redis>=5.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "prometheus-client>=0.19.0",
    "aiosmtplib>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Yaima/honey-prompt-detector"
Repository = "https://github.com/Yaima/honey-prompt-detector"
Issues = "https://github.com/Yaima/honey-prompt-detector/issues"

[project.scripts]
honey-prompt = "honey_prompt_detector.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honey_prompt_detector = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = """
    --verbose
    --cov=src/honey_prompt_detector
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
"""

[tool.coverage.run]
source = ["src/honey_prompt_detector"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
